name: Fork Release
run-name: Fork release - ${{ github.ref_name }}

# Fork-only. A pushed v*-m* tag reuses the image the monitored push already built for that
# commit (ghcr sha-<12>) instead of rebuilding, then publishes the GitHub Release.
on:
  push:
    tags: ["v*.*.*-m*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Tag Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on monitored
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin monitored
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/monitored; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on monitored"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Wait for the commit image
        shell: bash
        run: |
          set -euo pipefail
          src="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"
          for _ in $(seq 1 200); do
            if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              echo "found $src"
              exit 0
            fi
            echo "waiting for $src (Container Image workflow still building?)"
            sleep 30
          done
          echo "::error::$src never appeared. Run the Container Image workflow on ${GITHUB_REF_NAME}, then re-run this job."
          exit 1

      - name: Tag version and latest
        shell: bash
        run: |
          set -euo pipefail
          full="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --tag "${full}:${GITHUB_REF_NAME#v}" \
            --tag "${full}:latest" \
            "${full}:sha-${GITHUB_SHA:0:12}"

  release:
    name: Publish GitHub Release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream history and release tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/bookorbit/bookorbit.git
          git fetch --no-tags upstream main
          git fetch --no-tags upstream 'refs/tags/v*:refs/tags/v*'

      - name: Build notes (upstream release notes, then fork additions)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf '**Image:** `%s/%s:%s`\n\n' "$REGISTRY" "$IMAGE_NAME" "${GITHUB_REF_NAME#v}"
            node scripts/fork/release-notes.mjs "$GITHUB_REF_NAME" --release-body --to "$GITHUB_SHA"
          } > notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "BookOrbit ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
