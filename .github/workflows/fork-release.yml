name: Fork Release
run-name: Fork release - ${{ github.ref_name }}

# Fork-only. A pushed v*-m* tag reuses the image the monitored push already built for that
# commit (ghcr sha-<12>) instead of rebuilding, then publishes the GitHub Release.
# Only the highest fork tag moves :latest; a lower (backfilled) tag gets a notes-only release.
on:
  push:
    tags: ["v*.*.*-m*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  plan:
    name: Check Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on monitored
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin monitored
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/monitored; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on monitored"
            exit 1
          fi

      - name: Decide whether this is the latest release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          highest="$(git tag --list 'v*.*.*-m*' --sort=-v:refname | head -n 1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "${GITHUB_REF_NAME} is below ${highest}: notes-only release, :latest stays"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Tag Release Image
    needs: plan
    if: needs.plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Wait for the commit image
        shell: bash
        run: |
          set -euo pipefail
          src="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"
          for _ in $(seq 1 200); do
            if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              echo "found $src"
              exit 0
            fi
            echo "waiting for $src (Container Image workflow still building?)"
            sleep 30
          done
          echo "::error::$src never appeared. Run the Container Image workflow on ${GITHUB_REF_NAME}, then re-run this job."
          exit 1

      # The commit image carries APP_VERSION=sha-<commit>, which the sidebar shows. Retagging would keep
      # it, so the release image is the commit image plus one ENV layer. No RUN step, so the arm64 variant
      # needs no emulation and nothing is rebuilt. Without a leading "v" the version stays outside the
      # app's update check and release-notes cap, which only apply to upstream's v-prefixed tags.
      - name: Tag version and latest
        shell: bash
        run: |
          set -euo pipefail
          full="${REGISTRY}/${IMAGE_NAME}"
          version="${GITHUB_REF_NAME#v}"
          context="$(mktemp -d)"
          printf 'ARG SOURCE_IMAGE\nFROM ${SOURCE_IMAGE}\nARG APP_VERSION\nENV APP_VERSION=${APP_VERSION}\n' > "${context}/Dockerfile"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "SOURCE_IMAGE=${full}:sha-${GITHUB_SHA:0:12}" \
            --build-arg "APP_VERSION=${version}" \
            --provenance=false --sbom=false \
            --tag "${full}:${version}" \
            --tag "${full}:latest" \
            --push "${context}"

  release:
    name: Publish GitHub Release
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream history and release tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/bookorbit/bookorbit.git
          git fetch --no-tags upstream main
          # Forced: origin holds annotated copies of upstream's tags (same commits, other tag objects).
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/v*'
          git fetch --no-tags origin monitored:refs/remotes/origin/monitored

      # Each upstream release this one brings in gets its own entry, dated when monitored merged it so
      # the list reads 3.4.0, 3.4.0-m1, 3.4.0-m2. A tag's date is what orders the release list.
      - name: Mirror the upstream releases this one brings in
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/fork/release-notes.mjs "$GITHUB_REF_NAME" --fresh-upstream --to "$GITHUB_SHA" > fresh.txt
          while read -r tag sha adopted; do
            gh release view "$tag" >/dev/null 2>&1 && continue
            if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              object=$(gh api "repos/${GH_REPO}/git/tags" -f tag="$tag" -f message="BookOrbit ${tag#v} (upstream)" -f object="$sha" -f type=commit \
                -f 'tagger[name]=github-actions[bot]' -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' -f "tagger[date]=${adopted}" -q .sha)
              gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="$object" >/dev/null
            fi
            node scripts/fork/release-notes.mjs "$tag" --upstream-release > mirror.md
            gh release create "$tag" --verify-tag --latest=false --title "BookOrbit ${tag#v}" --notes-file mirror.md
          done < fresh.txt

      - name: Build notes (highlights, upstream merged in this release, then fork changes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          image=()
          if [ "$LATEST" = "true" ]; then
            image=(--image "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME#v}")
          fi
          node scripts/fork/release-notes.mjs "$GITHUB_REF_NAME" --release-body --to "$GITHUB_SHA" "${image[@]}" > notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh otherwise resolves a fork to its parent repository.
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag "--latest=${LATEST}" --title "BookOrbit ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
